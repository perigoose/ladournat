name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fetch the repo code into the runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Log in to GHCR with the token GitHub creates for each run
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build web/Dockerfile and push the image
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./web
          push: true
          tags: ghcr.io/perigoose/ladournat-web:latest
