name: deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fetch the repo code into the runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Log in to GHCR with the token GitHub creates for each run
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build web/Dockerfile and push the image
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          push: true
          tags: ghcr.io/perigoose/ladournat-web:latest

  deploy:
    # Run only if the build job succeeded
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Expose secrets as env vars, masked as *** in logs
        env:
          SSH_KEY: ${{ secrets.LADOURNAT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LADOURNAT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ladournat_deploy
          chmod 600 ~/.ssh/id_ladournat_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ladournat_deploy perigoose@ladournat.fr
