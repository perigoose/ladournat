name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fetch the repo code into the runner
      - uses: actions/checkout@v4
      # Log in to GHCR with the token GitHub creates for each run
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build web/Dockerfile and push the image
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/perigoose/ladournat-web:latest
